[project]
name = "multi-agent-video-pipeline"
version = "0.1.0"
description = "OpenClaw-driven multi-agent text-to-video pipeline MVP"
requires-python = ">=3.11"
dependencies = [
  "aiohttp",
  "anthropic",
  "certifi",
  "fal-client",
  "opencv-python",
  "pydantic",
  "pydantic-settings",
  "structlog",
  "tenacity"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

